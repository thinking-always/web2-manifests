apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: web2-prod
patches:
  - target:
      kind: Deployment
      name: web2
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: web2
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: web2-prod.localhost
images:
  - name: ghcr.io/thinking-always/web2-app
    newTag: "988b959d178641220be74bc89985dc24422bd42e"