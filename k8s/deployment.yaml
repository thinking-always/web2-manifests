apiVersion: apps/v1
kind: Deployment
metadata:
  name: web2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web2
  template:
    metadata:
      labels:
        app: web2
    spec:
      containers:
      - name: web2
        image: ghcr.io/thinking-always/web2-app:8763c3d81f4d21d64bb4272b5db8c324236a4111
        ports:
        - containerPort: 80