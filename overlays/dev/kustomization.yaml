apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
namespace: web2-dev
patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: web2-dev.localhost
  target:
    kind: Ingress
    name: web2
images:
- name: ghcr.io/thinking-always/web2-app
  newName: ghcr.io/thinking-always/web2-app
  newTag: 660af2cb6180e62907fa91c0859ff2e9676f6a26
