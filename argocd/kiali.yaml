apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: "*"
    helm:
      values: |
        auth:
          strategy: anonymous
        external_services:
          prometheus:
            url: http://monitoring-kube-prometheus-prometheus.monitoring:9090
          grafana:
            enabled: false
          tracing:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true