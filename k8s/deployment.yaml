apiVersion: apps/v1
kind: Deployment
metadata:
  name: web2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web2
  template:
    metadata:
      labels:
        app: web2
    spec:
      containers:
      - name: web2
        image: ghcr.io/thinking-always/web2-app:a61d7d89e5e13e584ce7fcbd4f4187f993e57b4f
        ports:
        - containerPort: 80