apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web2-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <https://github.com/thinking-always/web2-manifests.git>
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: web2-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true