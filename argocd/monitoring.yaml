apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <https://prometheus-community.github.io/helm-charts>
    chart: kube-prometheus-stack
    targetRevision: "*"
    helm:
      values: |
        alertmanager:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
        grafana:
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.localhost
  destination:
    server: <https://kubernetes.default.svc>
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true